<!doctype html>
<html lang="en">

    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/components.css" />

  <body>
    <!-- Icon sprite: stroke icons, 24x24 grid. Used via <svg class="icon"><use href="#i-…"/></svg>. -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true" focusable="false">
      <defs>
        <symbol id="i-sparkles" viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9zM19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
        <symbol id="i-compass" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></g></symbol>
        <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
        <symbol id="i-users" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5M16 5.2a3 3 0 0 1 0 5.6M18 14.8c1.9.7 3 2.4 3 5.2"/></g></symbol>
        <symbol id="i-user" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/></g></symbol>
        <symbol id="i-search" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></g></symbol>
        <symbol id="i-calendar" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/></g></symbol>
        <symbol id="i-clock" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></g></symbol>
        <symbol id="i-pin" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></g></symbol>
        <symbol id="i-share" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M8 8l4-4 4 4M5 12v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></g></symbol>
        <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
        <symbol id="i-info" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></g></symbol>

        <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
        <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.9 6.8 19.7l1-5.9L3.5 9.7l5.9-.8z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
        <symbol id="i-lock" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></g></symbol>

    </svg>

    <a class="skip-link" href="#main">Skip to content</a>

    <header class="topbar">
      <div class="topbar__inner">
        <a class="brand" href="#/" aria-label="Campus Hangouts home">
          <svg class="brand__logo" viewBox="0 0 32 32" aria-hidden="true">
            <rect width="32" height="32" rx="10" />
            <path d="M16 6l2.5 7.5L26 16l-7.5 2.5L16 26l-2.5-7.5L6 16l7.5-2.5z" />
          </svg>
          <span class="brand__word">Campus Hangouts</span>
        </a>


        <div class="session" id="session"></div>
      </div>
    </header>

    <nav class="tabbar" id="tabbar" aria-label="Primary">
      <a class="tab" href="#/" data-nav="feed"><svg class="icon" aria-hidden="true"><use href="#i-sparkles" /></svg><span>For you</span></a>
      <a class="tab" href="#/browse" data-nav="browse"><svg class="icon" aria-hidden="true"><use href="#i-compass" /></svg><span>Browse</span></a>
      <a class="tab tab--host" href="#/host" data-nav="host" aria-label="Host a hangout"><span class="tab__plus"><svg class="icon" aria-hidden="true"><use href="#i-plus" /></svg></span><span class="tab__label">Host</span></a>
      <a class="tab" href="#/crews" data-nav="crews"><svg class="icon" aria-hidden="true"><use href="#i-users" /></svg><span>Crews</span></a>
      <a class="tab" href="#/me" data-nav="me"><svg class="icon" aria-hidden="true"><use href="#i-user" /></svg><span>Me</span></a>
    </nav>

    <main id="main">
      <div id="view" class="view"></div>
      <p class="mock-pill" id="mode-pill" hidden>Mock data</p>
    </main>

    <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

    <dialog id="sheet" class="sheet" aria-labelledby="sheet-title">
      <div class="sheet__grab" aria-hidden="true"></div>
      <header class="sheet__head">
        <h2 id="sheet-title" data-sheet-title></h2>
        <button type="button" class="icon-btn" data-sheet-close aria-label="Close"><svg class="icon" aria-hidden="true"><use href="#i-close" /></svg></button>
      </header>
      <div class="sheet__body" data-sheet-body></div>
    </dialog>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
